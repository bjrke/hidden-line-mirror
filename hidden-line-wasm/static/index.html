<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Hidden Line Elimination producing vectorized polygons, written in Rust, compiled to wasm, rendered as SVG
  </title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <svg tabindex="0"></svg>

  <form id="formulaForm">
    <pre>(x,y) => {</pre>
    <textarea id="formula">let h=0;
const step=Math.PI/36;
for (let a=0; a<Math.PI; a+=step) {
  const c=Math.cos(a);
  const s=Math.sin(a);
  const xd=x*c-y*s;
  const yd=x*s+y*c;
  h += Math.cos(a*Math.sqrt(xd*xd*25+yd*yd*100))/(Math.PI+a);
}
return h/10;</textarea>
    <pre>}</pre>
    <input id="submitFormula" type="submit" value="update formula">
  </form>
  <script src="index.js"></script>
</body>

</html>
