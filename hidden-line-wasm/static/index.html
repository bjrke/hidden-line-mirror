<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Hidden Line Elimination producing vectorized polygons, written in Rust, compiled to wasm, rendered as SVG
  </title>
</head>

<style>
  svg {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    z-index: -1;
  }

  #formulaForm {
    background: none;
    margin: 5px;
    padding: 5px;
    color: white;
  }

  #formulaForm pre {
    margin: 0;
  }

  #formula {
    margin-left: 10px;
    white-space: pre;
    background: none;
    border: none;
    resize: none;
    color: white;
    width: 100%;
    height: 0;
  }
</style>

<body>

  <svg tabindex="0"></svg>

  <form id="formulaForm">
    <pre>(x,y) => {</pre>
    <textarea id="formula"></textarea>
    <pre>}</pre>
    <input id="submitFormula" type="submit" value="update formula">
  </form>
  <script src="index.js"></script>
</body>

</html>
