[package]
name = "hidden-line-wasm"
description = "Hidden Line Elimination producing vectorized polygons, written in Rust, compiled to wasm, rendered as SVG"
license = "Beerware"
repository = "https://gitlab.com/bjrke/hidden-line"
version = "0.1.0"
authors = ["Jan Burkhardt <264754-bjrke@users.noreply.gitlab.com>"]
categories = ["wasm"]
readme = "README.md"
edition = "2018"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true

[features]
#default = ["wee_alloc"]

[dependencies]
wasm-bindgen = "0.2.58"
wee_alloc = { version = "0.4.5", optional = true }
rand = "0.7.3"

[dependencies.web-sys]
version = "0.3.22"
features = [
  "Document",
  "Element",
  "SvgElement",
  "Node"
]
[target."cfg(debug_assertions)".dependencies]
console_error_panic_hook = "0.1.6"

[dev-dependencies]
wasm-bindgen-test = "0.3.8"
futures = "0.3.1"
js-sys = "0.3.35"
wasm-bindgen-futures = "0.4.8"
